name: Import verified Nexus source
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Download and verify authored source
        run: |
          curl --fail --location --max-time 60 'https://opendroid-agent-lab.biggerflea1.chatgpt.site/nexus-source-b50ce5c66d7d.zip' -o /tmp/nexus-source.zip
          echo 'b50ce5c66d7dc0d3c68ca757a4f890da03719ad8917d223fecb1e3e5106d6a9f  /tmp/nexus-source.zip' | sha256sum -c -
      - name: Commit source to isolated branch
        run: |
          git fetch origin nexus/platform-foundation || true
          if git show-ref --verify --quiet refs/remotes/origin/nexus/platform-foundation; then
            git switch -C nexus/platform-foundation origin/nexus/platform-foundation
          else
            git switch -C nexus/platform-foundation
          fi
          git config user.name 'OpenDroid Nexus Builder'
          git config user.email '43252327+youcefhor@users.noreply.github.com'
          git merge origin/main --no-edit
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('/tmp/nexus-source.zip') as archive:
              for info in archive.infolist():
                  path=Path(info.filename)
                  if path.is_absolute() or '..' in path.parts or '.github' in path.parts:
                      raise ValueError('Unsafe archive path')
              archive.extractall('.')
          PY
          git config user.name 'OpenDroid Nexus Builder'
          git config user.email '43252327+youcefhor@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'Build Nexus foundation: persistent agents, evidence execution, workflows and SaaS workspace'
          git push origin HEAD:refs/heads/nexus/platform-foundation

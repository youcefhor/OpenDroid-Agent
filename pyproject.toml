[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opendroid-agent"
version = "0.3.0"
description = "Permission-first Android automation via ADB"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
opendroid = "opendroid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
